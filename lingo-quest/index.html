<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#e6f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lingo Quest">
  <title>Lingo Quest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="root"></div>
  <noscript>Lingo Quest needs JavaScript turned on.</noscript>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script src="js/data/languages.js"></script>
  <script src="js/data/pictures.js"></script>
  <script src="js/core/tones.js"></script>
  <script src="js/core/content.js"></script>

  <script src="js/core/storage.js"></script>
  <script src="js/core/questions.js"></script>
  <script src="js/core/speech.js"></script>

  <script type="text/babel" data-presets="react" src="js/ui/common.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/ui/lesson.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/ui/home.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/ui/parent.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/app.jsx"></script>

  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
